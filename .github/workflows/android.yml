name: Build & Auto Release

on:
  push:
    branches: [ main, master ]
    paths:
      - 'CHANGELOG.md'
  workflow_dispatch: # 纯手动触发，不需要填任何表单

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-28 build-tools;28.0.3 platform-tools'

      - name: Set up JDK 8 Zulu
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'
          java-package: jdk

      - name: Point JAVA_HOME to JDK 8
        run: |
          if [ -n "$JAVA_HOME_8_X64" ]; then
            echo "JAVA_HOME=$JAVA_HOME_8_X64" >> $GITHUB_ENV
          fi

      - name: Setup Gradle 5.6.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-5.6.4-bin.zip
          unzip -q gradle-5.6.4-bin.zip
          echo "$PWD/gradle-5.6.4/bin" >> $GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 从 Secrets 静默解码
      - name: Decode Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.NAS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "OK: Release keystore decoded"
          else
            echo "WARN: NAS_KEYSTORE_BASE64 not set, fallback to debug signing"
          fi

      - name: Sync Version & Build
        env:
          NAS_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          NAS_KEYSTORE_PASSWORD: ${{ secrets.NAS_KEYSTORE_PASSWORD }}
          NAS_KEY_ALIAS: ${{ secrets.NAS_KEY_ALIAS }}
          NAS_KEY_PASSWORD: ${{ secrets.NAS_KEY_PASSWORD }}
        shell: bash
        run: |
          python sync_version.py
          VERSION=$(grep -oP '##\s*\[?v?\K\d+\.\d+\.\d+' CHANGELOG.md | head -1)
          
          gradle assembleRelease --no-daemon
          
          # 寻找已签名的 release 包并重命名
          find app/build/outputs/apk/release/ -name "*.apk" -not -name "*unaligned*" | head -n 1 | xargs -I {} mv {} app/build/outputs/apk/release/OldSend-v${VERSION}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oldsend-apk
          path: app/build/outputs/apk/release/OldSend-v*.apk

  auto-release:
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check and Create Tag
        id: check_tag
        run: |
          VERSION=$(grep -oP '##\s*\[?v?\K\d+\.\d+\.\d+' CHANGELOG.md | head -1)
          if [ -z "$VERSION" ]; then
            echo "skip_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION 已存在，跳过发布。"
            echo "skip_release=true" >> $GITHUB_OUTPUT
          else
            echo "发现新版本 v$VERSION，开始发版流程！"
            echo "skip_release=false" >> $GITHUB_OUTPUT
            echo "version=v$VERSION" >> $GITHUB_OUTPUT
            git config user.name "GitHub Action"
            git config user.email "action@github.com"
            git tag -a "v$VERSION" -m "Auto Release v$VERSION"
            git push origin "v$VERSION"
          fi

      # 提取 CHANGELOG 里的最新内容
      - name: Extract Release Notes
        if: steps.check_tag.outputs.skip_release == 'false'
        shell: bash
        run: |
          python -c "
          import re
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              content = f.read()
          match = re.search(r'##\s*\[?v?\d+\.\d+\.\d+\]?.*?(?=##\s*\[?v?\d+\.\d+\.\d+\]?|$)', content, re.S)
          if match:
              with open('release_notes.md', 'w', encoding='utf-8') as f:
                  f.write(match.group(0).strip())
          "
          
      - uses: actions/download-artifact@v4
        if: steps.check_tag.outputs.skip_release == 'false'
        with:
          path: ./all_artifacts

      - name: Prepare Standalone Files
        if: steps.check_tag.outputs.skip_release == 'false'
        run: |
          mkdir -p release_files
          find ./all_artifacts/oldsend-apk -type f -name "*.apk" -exec cp {} release_files/ \;

      - name: Create GitHub Release
        if: steps.check_tag.outputs.skip_release == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_tag.outputs.version }}
          files: release_files/*
          body_path: release_notes.md # 使用我们提取的 Changelog
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
