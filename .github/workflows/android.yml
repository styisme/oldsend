name: android-build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-28 build-tools;28.0.3 platform-tools'

      - name: Set up JDK 8 Zulu (has tools.jar)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'
          java-package: jdk

      - name: Point JAVA_HOME to JDK 8
        run: |
          if [ -n "$JAVA_HOME_8_X64" ]; then
            echo "JAVA_HOME=$JAVA_HOME_8_X64" >> $GITHUB_ENV
          else
            JDK8_PATH=$(dirname $(dirname $(readlink -f $(which java))))
            echo "JAVA_HOME=$JDK8_PATH" >> $GITHUB_ENV
          fi

      - name: Verify tools.jar
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          ls -l "$JAVA_HOME/lib/tools.jar" || ls -l "$JAVA_HOME/jre/lib/tools.jar" || echo "MISSING"

      - name: Setup Gradle 5.6.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-5.6.4-bin.zip
          unzip -q gradle-5.6.4-bin.zip
          echo "$PWD/gradle-5.6.4/bin" >> $GITHUB_PATH

      - name: Clean stale caches
        run: |
          rm -rf ~/.gradle/caches/transforms-* || true
          rm -rf app/build build || true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oldsend-debug
          path: app/build/outputs/apk/debug/*.apk
