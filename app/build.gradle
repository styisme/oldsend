apply plugin: 'com.android.application'

android {

    signingConfigs {
        release {
            def ksPath = System.getenv("NAS_KEYSTORE_PATH")
            if (ksPath != null && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("NAS_KEYSTORE_PASSWORD")
                keyAlias System.getenv("NAS_KEY_ALIAS")
                keyPassword System.getenv("NAS_KEY_PASSWORD")
            }
        }
    }

    
    compileSdkVersion 28
    buildToolsVersion "28.0.3"

    defaultConfig {
        applicationId "org.oldsend"
        minSdkVersion 10
        targetSdkVersion 28
        versionCode 20
        versionName "2.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
        encoding = "UTF-8"
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("NAS_KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    
}


